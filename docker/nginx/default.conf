# Gateway da API local — faz o papel que o Kong fazia no Supabase.
#
# O @supabase/supabase-js monta as URLs como <VITE_SUPABASE_URL>/rest/v1/<tabela>,
# enquanto o PostgREST serve as tabelas na raiz. Este proxy reescreve o prefixo,
# e é só por causa dele que o frontend funciona sem alteração de código.

upstream postgrest {
  server postgrest:3000;
}

server {
  listen 80;
  server_name _;

  # Sem limite de upload: o PostgREST já restringe via PGRST_DB_MAX_ROWS.
  client_max_body_size 0;

  # Contrato do supabase-js.
  location /rest/v1/ {
    proxy_pass http://postgrest/;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Acesso direto ao PostgREST, útil para curl e para o OpenAPI em /.
  location / {
    proxy_pass http://postgrest/;
    include /etc/nginx/snippets/proxy.conf;
  }
}
