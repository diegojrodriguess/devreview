# Stack local do DevReview.
#
# As portas replicam as que o `supabase start` publicava, para que o frontend e
# o mcp-server funcionem sem nenhuma mudança de configuração:
#
#   54321 → API REST (antes: Supabase API / agora: nginx + PostgREST)
#   54322 → Postgres
#   54323 → UI do banco (antes: Supabase Studio / agora: pgAdmin)

name: devreview

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: devreview/postgres:15
    container_name: devreview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Consumida pelo init/01-roles.sh para criar o role do PostgREST.
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:-authenticator}
    ports:
      # Mesma porta do [db] no antigo supabase/config.toml.
      - "${POSTGRES_PORT:-54322}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Expõe o schema public como API REST no mesmo contrato que o
  # @supabase/supabase-js já consome (o Supabase usa PostgREST por baixo).
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: devreview-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:-authenticator}@postgres:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_USE_LEGACY_GUCS: "false"
      # Mesmo segredo do Supabase local, então as anon/service keys que já
      # estão nos .env.example continuam válidas.
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:${API_PORT:-54321}/rest/v1
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Gateway da API: traduz o prefixo /rest/v1 que o @supabase/supabase-js usa
  # para a raiz do PostgREST — o papel que o Kong cumpria no Supabase.
  api:
    image: nginx:1.27-alpine
    container_name: devreview-api
    restart: unless-stopped
    ports:
      # Mesma porta do [api] no antigo supabase/config.toml.
      - "${API_PORT:-54321}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/proxy.conf:/etc/nginx/snippets/proxy.conf:ro
    depends_on:
      - postgrest

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: devreview-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@devreview.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: 80
    ports:
      # Mesma porta do [studio] no antigo supabase/config.toml.
      - "${PGADMIN_PORT:-54323}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Deixa a conexão com o Postgres já cadastrada ao abrir o pgAdmin.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
